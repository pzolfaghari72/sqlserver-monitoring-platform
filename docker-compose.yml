name: sqlserver-monitoring-platform

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__EXECUTOR: LocalExecutor

  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

  PYTHONPATH: /opt/airflow

  SQLSERVER_HOST: ${SQLSERVER_HOST}
  SQLSERVER_PORT: ${SQLSERVER_PORT}
  SQLSERVER_USER: ${SQLSERVER_USER}
  SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD}
  SQLSERVER_DB: ${SQLSERVER_DB}
  INSTANCE_NAME: ${INSTANCE_NAME}

  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  environment:
    <<: *airflow-common-env
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./shared:/opt/airflow/shared:ro
    - ./sql:/opt/airflow/sql:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    container_name: monitoring_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e

        echo "Waiting for PostgreSQL..."
        until nc -z postgres 5432; do
          sleep 2
        done

        echo "Running Airflow DB migration..."
        airflow db migrate

        echo "Creating Airflow admin user if not exists..."
        airflow users create \
          --role Admin \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Data \
          --lastname Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true

        echo "Airflow initialization completed."

  airflow:
    <<: *airflow-common
    container_name: airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: scheduler

  grafana:
    image: grafana/grafana:11.0.0
    container_name: monitoring_grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  pg_data:
  grafana_data:
