services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  database-init:
    image: postgres:16-alpine
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - .:/opt/monitoring-platform:ro
    command: ["bash", "/opt/monitoring-platform/scripts/bootstrap/init_database.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?SQLSERVER_SA_PASSWORD is required}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    env_file: .env
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${SQLSERVER_SA_PASSWORD}" -C -Q "SELECT 1" >/dev/null 2>&1; do sleep 3; done;
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${SQLSERVER_SA_PASSWORD}" -C -Q "IF DB_ID('MonitoringDemo') IS NULL CREATE DATABASE MonitoringDemo; IF NOT EXISTS (SELECT 1 FROM sys.sql_logins WHERE name = 'monitoring_user') CREATE LOGIN [monitoring_user] WITH PASSWORD = '$${SQLSERVER_PASSWORD}', CHECK_POLICY = OFF; ELSE ALTER LOGIN [monitoring_user] WITH PASSWORD = '$${SQLSERVER_PASSWORD}'; GRANT VIEW SERVER STATE TO [monitoring_user]; GRANT VIEW ANY DATABASE TO [monitoring_user]; GRANT VIEW ANY DEFINITION TO [monitoring_user]; USE [msdb]; IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = 'monitoring_user') CREATE USER [monitoring_user] FOR LOGIN [monitoring_user]; GRANT EXECUTE ON OBJECT::dbo.agent_datetime TO [monitoring_user]; GRANT SELECT ON OBJECT::dbo.sysjobs TO [monitoring_user]; GRANT SELECT ON OBJECT::dbo.sysjobhistory TO [monitoring_user];";
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/app/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONITORING_API_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      database-init:
        condition: service_completed_successfully

  airflow-init:
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    restart: "no"
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/${POSTGRES_DB}
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Platform --lastname Admin --role Admin --email admin@example.local || true)
    depends_on:
      database-init:
        condition: service_completed_successfully

  airflow-webserver:
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/${POSTGRES_DB}
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./collector:/opt/airflow/collector
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/${POSTGRES_DB}
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./collector:/opt/airflow/collector
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  postgres_data:
  sqlserver_data:
  grafana_data:
